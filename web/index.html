<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LITEMON · go-litemon</title>
<style>
  :root{
    --fg:#d7dee8;
    --dim:#7f8b9b;
    --good:#4ade80;
    --mid:#facc15;
    --bad:#f87171;
    --gpu:#a78bfa;
    --track:rgba(255,255,255,.10);
    --panel:transparent;          /* 面板透明：默认完全透明，?panel=0.45 可加半透明底 */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;}   /* 透明背景，可当 OBS/桌面挂件用 */
  body{
    font:13px/1.45 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "PingFang SC", monospace;
    color:var(--fg);
    display:flex; align-items:flex-start; justify-content:center;
    padding:14px;
  }
  .panel{
    background:var(--panel);
    border-radius:14px;
    padding:12px 14px 10px;
    width:min(760px,100%);
    backdrop-filter:blur(6px);
  }
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .brand{display:flex;gap:8px;align-items:baseline;letter-spacing:.14em;font-weight:700;font-size:12px;color:#9fb3c8}
  .host{color:var(--dim);letter-spacing:.06em;font-weight:400}
  .btn{
    all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    padding:4px 10px;border-radius:999px;font-size:11.5px;
    background:rgba(255,255,255,.06);color:var(--dim);
    border:1px solid rgba(255,255,255,.10);
  }
  .btn:hover{color:#fff;background:rgba(255,255,255,.12)}
  .btn .dot{width:7px;height:7px;border-radius:50%;background:#64748b}
  .btn.on .dot{background:var(--good);box-shadow:0 0 8px var(--good)}
  .btn.on{color:var(--good);border-color:rgba(74,222,128,.35)}

  /* 指标区：6 列固定网格，标签列与数值列分离，天然对齐 */
  .grid{
    display:grid;
    grid-template-columns:repeat(3, max-content) 1fr max-content 1fr;
    column-gap:14px; row-gap:7px;
    align-items:baseline;
  }
  .k{color:var(--dim);font-size:11.5px;letter-spacing:.08em}
  .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;min-width:76px}
  .v.small{font-weight:500}
  .up{color:var(--good)} .down{color:var(--fg)}

  /* 磁盘区：名称 | 进度条 | 百分比 | 容量（右对齐等宽数字）*/
  /* 磁盘：只显示总空间一行，四列固定，容量列右对齐 */
  .disks{margin-top:11px;display:grid;grid-template-columns:1fr;row-gap:5px}
  .diskrow{
    display:grid;
    grid-template-columns:70px 1fr 52px 150px;
    align-items:center; column-gap:12px;
  }
  .mnt{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{height:7px;border-radius:999px;background:var(--track);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:999px;transition:width .5s ease}
  .pct{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
  .cap{font-variant-numeric:tabular-nums;text-align:right;color:var(--dim);font-size:12px}
  .g{background:var(--good)} .y{background:var(--mid)} .r{background:var(--bad)}
  .na{color:#4b5563}
  .foot{margin-top:9px;display:flex;justify-content:space-between;color:#4b5563;font-size:10.5px;letter-spacing:.08em}
</style>
</head>
<body>
  <div class="panel" id="panel">
    <div class="head">
      <div class="brand">LITEMON <span class="host" id="host">loading…</span></div>
      <button class="btn" id="autoBtn" title="开机自启（systemd）">
        <span class="dot"></span><span id="autoTxt">自启 —</span>
      </button>
    </div>

    <div class="grid">
      <span class="k">CPU</span><span class="v" id="cpu">--</span>
      <span class="k">GPU</span><span class="v" id="gpu">--</span>
      <span class="k">显存</span><span class="v" id="gpumem">--</span>

      <span class="k">CPU 温</span><span class="v small" id="cputemp">--</span>
      <span class="k">GPU 温</span><span class="v small" id="gputemp">--</span>
      <span class="k">内存</span><span class="v" id="mem">--</span>

      <span class="k">读</span><span class="v small" id="read">--</span>
      <span class="k">写</span><span class="v small" id="write">--</span>
      <span class="k">负载</span><span class="v small" id="load">--</span>

      <span class="k">↑ 上行</span><span class="v small up" id="up">--</span>
      <span class="k">↓ 下行</span><span class="v small down" id="down">--</span>
      <span class="k"></span><span></span>
    </div>

    <div class="disks">
      <div class="diskrow">
        <span class="mnt">磁盘</span>
        <span class="bar"><i id="diskBar" class="g" style="width:0%"></i></span>
        <span class="pct" id="diskPct">--</span>
        <span class="cap" id="diskCap">-- / --</span>
      </div>
    </div>
    <div class="foot"><span id="ts">--</span><span id="hint">面板透明 · 可直接作为浏览器源叠在桌面/OBS 上</span></div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const pct = (v) => (v == null ? "N/A" : v.toFixed(1) + "%");
const temp = (v) => (v == null ? "N/A" : v.toFixed(1) + "°C");

function color(v, warn = 70, bad = 88) {
  if (v == null) return "";
  return v >= bad ? "r" : v >= warn ? "y" : "g";
}
function humanKBps(kb) {
  if (kb == null) return "N/A";
  if (kb >= 1024 * 1024) return (kb / 1024 / 1024).toFixed(1) + "GB";
  if (kb >= 1024) return (kb / 1024).toFixed(1) + "MB";
  return Math.round(kb) + "KB";
}
function humanBytes(b) {
  const u = ["B", "K", "M", "G", "T"];
  let i = 0, n = b;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + u[i];
}

let autostartBusy = false;
async function loadAutostart() {
  try {
    const r = await fetch("/api/autostart").then(r => r.json());
    const btn = $("autoBtn");
    btn.classList.toggle("on", !!r.enabled);
    $("autoTxt").textContent = r.supported ? (r.enabled ? "自启 开" : "自启 关") : "自启 不支持";
    btn.title = r.supported
      ? `systemd ${r.unit}：enabled=${r.enabled} active=${r.running}`
      : (r.message || "不支持");
  } catch (e) { /* ignore */ }
}
$("autoBtn").addEventListener("click", async () => {
  if (autostartBusy) return;
  autostartBusy = true;
  try {
    const cur = await fetch("/api/autostart").then(r => r.json());
    const res = await fetch("/api/autostart", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ enable: !cur.enabled }),
    }).then(r => r.json());
    if (!res.ok) alert("设置失败：" + (res.error || "未知错误"));
  } catch (e) {
    alert("请求失败：" + e);
  } finally {
    autostartBusy = false;
    loadAutostart();
  }
});

function render(d) {
  $("host").textContent = d.host || "";
  $("cpu").textContent = pct(d.cpu);
  $("gpu").textContent = d.gpu == null ? "N/A" : pct(d.gpu);
  $("gpumem").textContent = d.gpuMem == null ? "N/A" : pct(d.gpuMem);
  $("cputemp").textContent = temp(d.cpuTemp);
  $("gputemp").textContent = temp(d.gpuTemp);
  $("mem").textContent = pct(d.mem);
  $("read").textContent = humanKBps(d.readBps) + "/s";
  $("write").textContent = humanKBps(d.writeBps) + "/s";
  $("load").textContent = (d.load1 ?? 0).toFixed(2);
  $("up").textContent = humanKBps(d.upBps / 1024) + "/s";     // B/s → KB/s
  $("down").textContent = humanKBps(d.downBps / 1024) + "/s";
  $("ts").textContent = new Date(d.ts * 1000).toLocaleTimeString();

  // 磁盘：只显示总空间（不列挂载点）
  const dp = d.diskPercent ?? null;
  const bar = $("diskBar");
  bar.className = color(dp);
  bar.style.width = Math.min(dp || 0, 100) + "%";
  $("diskPct").textContent = dp == null ? "N/A" : dp.toFixed(0) + "%";
  $("diskPct").className = "pct " + (dp >= 88 ? "r" : dp >= 70 ? "y" : "");
  $("diskCap").textContent = humanBytes(d.diskUsed || 0) + " / " + humanBytes(d.diskTotal || 0);
}

async function tick() {
  try {
    const d = await fetch("/api/metrics", { cache: "no-store" }).then(r => r.json());
    render(d);
  } catch (e) {
    $("host").textContent = "连接断开…";
  }
}

// 面板透明度：默认完全透明，?panel=0.45 给一层毛玻璃底
const p = new URLSearchParams(location.search).get("panel");
if (p) document.documentElement.style.setProperty("--panel", `rgba(12,16,22,${p})`);

loadAutostart();
tick();
setInterval(tick, 2000);
setInterval(loadAutostart, 15000);
</script>
</body>
</html>
